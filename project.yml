name: DinoCode
options:
  bundleIdPrefix: com.dinocode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    DEVELOPMENT_ASSET_PATHS: ""

targets:
  DinoCode:
    type: application
    platform: iOS
    sources:
      - path: DinoCode
    info:
      path: DinoCode/App/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # iPad landscape only, presenting/AirPlay friendly - no portrait rotation mid-demo.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        CFBundleDisplayName: DinoCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinocode.DinoCode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
