name: DinoCode
options:
  bundleIdPrefix: com.dinocode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    DEVELOPMENT_ASSET_PATHS: ""

targets:
  DinoCode:
    type: application
    platform: iOS
    sources:
      - path: DinoCode
    info:
      path: DinoCode/App/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # iPad landscape only, presenting/AirPlay friendly - no portrait rotation mid-demo.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        CFBundleDisplayName: DinoCode
        # No networking/encryption in this app at all - declaring this
        # up front means every future TestFlight build skips App Store
        # Connect's "Missing Compliance" export-compliance prompt instead
        # of blocking each upload until someone answers it manually.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinocode.DinoCode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true

# Explicit *shared* scheme so a fresh, non-interactive checkout (Xcode Cloud,
# or any headless `xcodebuild`) can find something to build/archive. Without
# this, xcodegen leaves scheme creation to Xcode's "autocreate" behavior,
# which only exists in your local xcuserdata (gitignored, and Xcode Cloud
# never sees it since it clones the repo fresh).
schemes:
  DinoCode:
    build:
      targets:
        DinoCode: all
    archive:
      config: Release
